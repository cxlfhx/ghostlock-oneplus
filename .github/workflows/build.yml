name: boot.img专属编译
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y abootimg build-essential
      - name: 安装NDK编译工具
        uses: Ylarod/setup-ndk-clang@v1
        id: setup-ndk
        with:
          ndk-version: r29
      - name: 下载并解包boot.img
        run: |
          wget "https://release-assets.githubusercontent.com/github-production-release-asset/1363655153/ed71844c-89cf-4180-aa09-de76fac14fa7?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-10T08%3A21%3A46Z&rscd=attachment%3B+filename%3Dboot.img&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-10T07%3A21%3A29Z&ske=2026-09-10T08%3A21%3A46Z&sks=b&skv=2018-11-09&sig=2qyCoNuBTwrovCct7snJjocxz0RloINwk4VokXNmbgA%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4OTAyNzAxNiwibmJmIjoxNzg5MDI1MjE2LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.2j2x2VP3emorXHiSdOQKe1yZFBW4gn_pdejqVu0RAuw&response-content-disposition=attachment%3B%20filename%3Dboot.img&response-content-type=application%2Foctet-stream" -O boot.img
          abootimg -x boot.img
      - name: 提取内核符号表
        run: |
          wget -q https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-vmlinux
          chmod +x extract-vmlinux
          ./extract-vmlinux zImage > vmlinux
          nm -n vmlinux | grep -E ' [TtDd] ' > kallsyms.txt
      - name: 生成偏移并编译
        run: |
          python3 tools/extract_target.py --kallsyms kallsyms.txt
          make NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock
          path: ghostlock
