name: boot.img专属编译
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential python3
      - name: 安装NDK编译工具
        uses: Ylarod/setup-ndk-clang@v1
        id: setup-ndk
        with:
          ndk-version: r29
      - name: 下载并解包boot.img
        run: |
          wget "https://github.com/cxlfhx/ghostlock-oneplus/releases/download/boot/boot.img" -O boot.img
          wget https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-21.0/unpack_bootimg.py
          chmod +x unpack_bootimg.py
          python3 unpack_bootimg.py --boot_img boot.img --out boot_out
      - name: 提取内核符号表
        run: |
          wget https://raw.githubusercontent.com/marin-m/vmlinux-to-elf/master/kallsyms_extractor.py
          chmod +x kallsyms_extractor.py
          python3 kallsyms_extractor.py boot_out/kernel kallsyms.txt
      - name: 生成偏移并编译
        run: |
          python3 tools/extract_target.py --kallsyms kallsyms.txt
          make NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock
          path: ghostlock
